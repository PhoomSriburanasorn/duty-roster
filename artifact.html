<title>ระบบจัดตารางเวร</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --panel2:#fbfbfc; --head:#fafbfc; --hover:#f2f4f6;
  --ink:#1b1f24; --muted:#6b7280; --dim:#b7bcc3; --soft-ink:#3c4249;
  --line:#e3e6ea; --track:#eceff2; --field:#fff;
  --brand:#2f6f6b; --brand-soft:#e6f2f1; --brand-line:#bcd9d6; --brand-ink:#1f4f4c;
  --warn:#b45309; --warn-soft:#fef3c7; --warn-line:#f0d59a; --warn-ink:#92400e;
  --bad:#b91c1c;  --bad-soft:#fee2e2;  --bad-line:#f0b4b4;  --bad-ink:#9b1c1c;
  --ok:#15803d;   --ok-soft:#dcfce7;   --ok-ink:#166534;
  --scrim:rgba(16,24,40,.42);
  --on-brand:#fff;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181a; --panel:#1b2124; --panel2:#1f2629; --head:#212a2d; --hover:#273135;
    --ink:#e6eaec; --muted:#93a0a4; --dim:#5d696d; --soft-ink:#b9c3c6;
    --line:#2c3639; --track:#2c3639; --field:#212a2d;
    --brand:#63b8b0; --brand-soft:#1d3330; --brand-line:#2f5a55; --brand-ink:#9ad5cd;
    --warn:#e8a94f; --warn-soft:#382a13; --warn-line:#5c4520; --warn-ink:#f0c483;
    --bad:#ef7676;  --bad-soft:#3a1e1e;  --bad-line:#663434;  --bad-ink:#f6a5a5;
    --ok:#6ec98d;   --ok-soft:#183024;   --ok-ink:#9ce0b2;
    --on-brand:#0e1a19; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#14181a; --panel:#1b2124; --panel2:#1f2629; --head:#212a2d; --hover:#273135;
  --ink:#e6eaec; --muted:#93a0a4; --dim:#5d696d; --soft-ink:#b9c3c6;
  --line:#2c3639; --track:#2c3639; --field:#212a2d;
  --brand:#63b8b0; --brand-soft:#1d3330; --brand-line:#2f5a55; --brand-ink:#9ad5cd;
  --warn:#e8a94f; --warn-soft:#382a13; --warn-line:#5c4520; --warn-ink:#f0c483;
  --bad:#ef7676;  --bad-soft:#3a1e1e;  --bad-line:#663434;  --bad-ink:#f6a5a5;
  --ok:#6ec98d;   --ok-soft:#183024;   --ok-ink:#9ce0b2;
  --on-brand:#0e1a19; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai","Sarabun",sans-serif;
  font-size:14px;line-height:1.5}
h1,h2,h3{margin:0;font-weight:650}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
  background:var(--field);padding:6px 12px;color:var(--ink)}
button:hover{background:var(--hover)}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:transparent;padding:4px 8px}
button.ghost:hover{background:var(--hover)}
button.danger{color:var(--bad);border-color:var(--bad-line)}
button.danger:hover{background:var(--bad-soft)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--field);color:var(--ink)}
input[type=number]{width:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--head)}
.wrap{max-width:1320px;margin:0 auto;padding:0 18px 70px}

header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hd{max-width:1320px;margin:0 auto;padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hd h1{font-size:16px;letter-spacing:-.2px}
.hd .sp{flex:1}
.monthpick{display:flex;align-items:center;gap:6px;background:var(--brand-soft);
  border:1px solid var(--brand-line);border-radius:9px;padding:3px 5px}
.monthpick b{font-size:14px;color:var(--brand-ink);min-width:120px;text-align:center}
.tabs{max-width:1320px;margin:0 auto;padding:0 18px;display:flex;gap:2px;overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;border-radius:0;
  padding:8px 13px;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.tabs button:hover{background:var(--hover)}
.tabs button i{font-style:normal;opacity:.55;margin-right:4px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-top:16px}
.card>.hdr{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card>.hdr h2{font-size:14px}
.card>.hdr .sp{flex:1}
.card>.bd{padding:14px 16px}
.card>.bd.flush{padding:0}
.hint{color:var(--muted);font-size:12.5px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:980px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;
  font-size:12px;font-weight:600;border:1px solid transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.neutral{background:var(--hover);color:var(--muted)}
.tag{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}
.empty{color:var(--muted);padding:22px;text-align:center;font-size:13px}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--brand);
  border-radius:6px;padding:9px 12px;font-size:12.5px;color:var(--soft-ink)}
.note.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:430px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cal .d{aspect-ratio:1/1;border:1px solid var(--line);border-radius:6px;display:flex;
  align-items:center;justify-content:center;font-size:12.5px;cursor:pointer;background:var(--field);user-select:none}
.cal .d.off{background:var(--hover);color:var(--dim);text-decoration:line-through}
.cal .d.on{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink);font-weight:600}
.cal .d.leave{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad-ink);font-weight:700;text-decoration:none}
.cal .d.blank{border:0;background:transparent;cursor:default}

.sched td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:top}
.sched th{position:sticky;top:50px;z-index:5}
.sched td.day{white-space:nowrap;font-size:12.5px;width:88px;color:var(--muted);padding-top:8px}
.sched td.day b{color:var(--ink);font-size:14px;margin-right:3px}
.sched tr.holiday td{background:var(--head);color:var(--dim)}
.slotbox{display:flex;flex-direction:column;gap:3px;min-width:120px}
.slot{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;
  padding:2px 6px;background:var(--field);cursor:pointer;min-height:27px}
.slot:hover{border-color:var(--brand);background:var(--panel2)}
.slot.empty{border-style:dashed;color:var(--muted);justify-content:center;font-size:12px}
.slot.bad{background:var(--bad-soft);border-color:var(--bad-line)}
.slot.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.slot.locked{box-shadow:inset 3px 0 0 var(--brand)}
.slot .nm{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .rl{font-size:10px;color:var(--muted);flex:none}
.slot .lk{opacity:.3;font-size:11px}
.slot.locked .lk{opacity:1}
.slot.drag{opacity:.35}
.slot.over{outline:2px solid var(--brand);outline-offset:1px}

.qt td,.qt th{padding:4px 7px;font-size:13px}
.qt input{width:56px;text-align:center;padding:3px 4px}
.qt .tot{font-variant-numeric:tabular-nums;text-align:center}
.qt tr.foot td{background:var(--head);font-weight:600;border-top:2px solid var(--line)}
.qt td.ok{background:var(--ok-soft)}
.qt td.bad{background:var(--bad-soft)}
.chk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.chk .ic{flex:none;width:18px}
.chk .tx{flex:1}
.chk .det{font-size:12px;color:var(--muted);margin-top:2px;white-space:pre-wrap}
.chk.fail .tx b{color:var(--bad)}
.chk.soft .tx b{color:var(--warn)}

.mask{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;
  justify-content:center;z-index:60;padding:20px}
.modal{background:var(--panel);border-radius:12px;max-width:560px;width:100%;max-height:84vh;
  display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.modal .mh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{font-size:15px;flex:1}
.modal .mb{padding:8px 0;overflow:auto}
.opt{display:flex;align-items:center;gap:9px;padding:7px 16px;cursor:pointer;border-left:3px solid transparent}
.opt:hover{background:var(--hover)}
.opt.cur{background:var(--brand-soft);border-left-color:var(--brand)}
.opt .why{font-size:11.5px;color:var(--bad);text-align:right}
.opt.blocked .nm{color:var(--muted)}
.opt .cnt{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:4px;background:var(--track);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--brand)}
@media print{
  header,.tabs,.noprint{display:none!important}
  body{background:#fff}.card{box-shadow:none;border:0}
  .sched th{position:static}
}
</style>
<header>
  <div class="hd">
    <h1>🗓️ ระบบจัดตารางเวร</h1>
    <div class="monthpick">
      <button class="ghost" onclick="shiftMonth(-1)">◀</button>
      <b id="mLabel">—</b>
      <button class="ghost" onclick="shiftMonth(1)">▶</button>
    </div>
    <span class="hint" id="saveInfo"></span>
    <div class="sp"></div>
    <button class="ghost" onclick="backup()">⤓ สำรอง</button>
    <button class="ghost" onclick="document.getElementById('restoreFile').click()">⤒ กู้คืนจากไฟล์</button>
    <button class="ghost" onclick="restorePaste()">📋 กู้คืนจากข้อความ</button>
    <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restore(this)">
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="wrap" id="view"></div>
<div id="modalHost"></div>

<script>
/* =====================================================================
   ระบบจัดตารางเวร — ไฟล์เดียว, เก็บใน localStorage
   ===================================================================== */
const LS_KEY = 'dutyRoster.v2';
const uid = () => Math.random().toString(36).slice(2,9);
const TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                   'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_DOW = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const PALETTE = ['#2f6f6b','#b45309','#5b21b6','#0e7490','#9d174d','#166534'];

let DB, MONTH, TAB='sched', STORAGE_OK=true;

/* ---------- โครงข้อมูล ---------- */
function blankDB(){
  const p1=uid(), p2=uid();
  return {
    positions:[{id:p1,name:'Senior',color:PALETTE[0]},{id:p2,name:'Junior',color:PALETTE[1]}],
    employees:[],
    defaultRooms:[
      {id:uid(),name:'ห้อง 1',slots:[{role:null},{role:null}],maxStreak:null,streakW:3},
      {id:uid(),name:'ห้อง 2',slots:[{role:null}],maxStreak:null,streakW:2},
    ],
    pairRules:[], months:{}, activeMonth:null
  };
}
function blankMonth(key){
  const [y,m] = key.split('-').map(Number);
  const nd = new Date(y,m,0).getDate();
  const workDays = {};
  for(let d=1; d<=nd; d++){ const dw=new Date(y,m-1,d).getDay(); workDays[d] = (dw!==0&&dw!==6); }
  return {
    key, workDays,
    rooms: DB.defaultRooms.map(r=>({id:r.id,name:r.name,
      slots:r.slots.map(s=>({role:s.role})),maxStreak:r.maxStreak,streakW:r.streakW})),
    leaves:{}, pairRules:{}.constructor===Object?[]:[],
    targets:{},          // empId -> {total, rooms:{rid:n}, maxWeek}
    soft:{
      even:    {on:true,  w:6},
      noB2B:   {on:true,  w:4, hard:false},
      weekly:  {on:true,  w:3},
      roomVar: {on:true,  w:3},
      pairVar: {on:true,  w:2},
      groupPref:{on:false, w:2, rooms:[]}
    },
    locks:{}, schedule:null, lastRun:null
  };
}
function tg(eid){
  if(!MONTH.targets[eid]) MONTH.targets[eid] = {total:null, rooms:{}, maxWeek:null};
  const t = MONTH.targets[eid];
  if(!t.rooms) t.rooms = {};
  return t;
}

function load(){
  try{ const raw = localStorage.getItem(LS_KEY); DB = raw ? JSON.parse(raw) : blankDB(); }
  catch(e){ DB = blankDB(); STORAGE_OK=false; }
  if(!DB.months) DB.months = {};
  if(!DB.activeMonth){ const n=new Date(); DB.activeMonth = monthKey(n.getFullYear(), n.getMonth()+2); }
  ensureMonth(DB.activeMonth); MONTH = DB.months[DB.activeMonth];
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){ STORAGE_OK=false; }
  const el = document.getElementById('saveInfo');
  if(el){
    el.textContent = STORAGE_OK ? 'บันทึกแล้ว ' + new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})
      : '⚠️ เบราว์เซอร์ไม่ให้เก็บข้อมูล — กด “สำรอง” ก่อนปิดหน้า';
    el.style.color = STORAGE_OK ? '' : 'var(--bad)';
  }
}
function ensureMonth(k){ if(!DB.months[k]) DB.months[k] = blankMonth(k); }
function monthKey(y,m){ const d=new Date(y,m-1,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function shiftMonth(n){
  const [y,m]=DB.activeMonth.split('-').map(Number);
  const k = monthKey(y,m+n); DB.activeMonth=k; ensureMonth(k); MONTH=DB.months[k]; save(); render();
}

/* ---------- helper ---------- */
const emps     = () => DB.employees.filter(e=>e.active!==false);
const empById  = id => DB.employees.find(e=>e.id===id);
const posById  = id => DB.positions.find(p=>p.id===id);
const posName  = id => (posById(id)||{}).name || '—';
const posColor = id => (posById(id)||{}).color || '#94a3b8';
const roomById = id => MONTH.rooms.find(r=>r.id===id);
const nDays    = () => { const [y,m]=MONTH.key.split('-').map(Number); return new Date(y,m,0).getDate(); };
const dowOf    = d => { const [y,m]=MONTH.key.split('-').map(Number); return new Date(y,m-1,d).getDay(); };
const workDayList = () => { const o=[]; for(let d=1;d<=nDays();d++) if(MONTH.workDays[d]) o.push(d); return o; };
const isLeave  = (e,d) => (MONTH.leaves[e]||[]).includes(d);
const allPairs = () => [...DB.pairRules, ...MONTH.pairRules];
const roomSize = r => r.slots.length;
const perDay   = () => MONTH.rooms.reduce((a,r)=>a+roomSize(r),0);
const totalSlots = () => workDayList().length * perDay();
const monthLabel = k => { const [y,m]=k.split('-').map(Number); return TH_MONTHS[m-1]+' '+(y+543); };
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function weeksOf(){
  const days = workDayList(), out=[]; let cur=[], last=-1;
  for(const d of days){ const dw=dowOf(d);
    if(cur.length && dw<=last){ out.push(cur); cur=[]; }
    cur.push(d); last=dw; }
  if(cur.length) out.push(cur);
  return out;
}
function weekIndex(){ const wi={}; weeksOf().forEach((w,i)=>w.forEach(d=>wi[d]=i)); return wi; }

/* =====================================================================
   PRE-FLIGHT — ตรวจว่าโจทย์เป็นไปได้ก่อนจัด
   ===================================================================== */
function preflight(){
  const errs=[], warns=[], info=[];
  const days = workDayList(), pool = emps();
  const slots = totalSlots();
  if(!pool.length) errs.push('ยังไม่มีพนักงาน');
  if(!days.length) errs.push('ยังไม่ได้เลือกวันทำการ');
  if(!MONTH.rooms.length) errs.push('ยังไม่ได้ตั้งค่าห้อง');
  if(errs.length) return {errs,warns,info,ok:false};

  info.push(`${days.length} วันทำการ × ${perDay()} คน/วัน = ${slots} ช่องเวร`);

  // 1) ผลรวมเป้ารายคน
  const fixed = pool.filter(e=>tg(e.id).total!=null);
  const sumFixed = fixed.reduce((a,e)=>a+tg(e.id).total,0);
  const free = pool.length - fixed.length;
  if(free===0 && sumFixed!==slots)
    errs.push(`ผลรวมเป้าเวรรายคน = ${sumFixed} แต่ช่องเวรทั้งเดือนมี ${slots} → ต่างกัน ${Math.abs(sumFixed-slots)} เวร (แก้เป้าของใครสักคน หรือแก้จำนวนวัน/ห้อง)`);
  else if(sumFixed > slots)
    errs.push(`เป้าเวรที่ล็อกไว้รวม ${sumFixed} เกินช่องเวรทั้งเดือน ${slots}`);
  else if(free>0)
    info.push(`ล็อกเป้าไว้ ${fixed.length} คน รวม ${sumFixed} เวร · เหลือ ${slots-sumFixed} เวร กระจายให้อีก ${free} คน`);

  // 2) โควตารายห้อง
  MONTH.rooms.forEach(r=>{
    const need = days.length*roomSize(r);
    const set = pool.filter(e=>tg(e.id).rooms[r.id]!=null);
    const sum = set.reduce((a,e)=>a+tg(e.id).rooms[r.id],0);
    if(set.length===pool.length && sum!==need)
      errs.push(`โควตาห้อง ${r.name} รวม ${sum} แต่ต้องการ ${need}`);
    else if(sum>need) errs.push(`โควตาห้อง ${r.name} ที่ล็อกไว้รวม ${sum} เกินความต้องการ ${need}`);
  });

  // 3) รายคน: โควตาห้องต้องไม่เกินเป้ารวม
  pool.forEach(e=>{
    const t = tg(e.id);
    const rs = MONTH.rooms.filter(r=>t.rooms[r.id]!=null);
    const sum = rs.reduce((a,r)=>a+t.rooms[r.id],0);
    if(t.total!=null){
      if(sum>t.total) errs.push(`${e.name}: โควตารายห้องรวม ${sum} เกินเป้ารวม ${t.total}`);
      else if(rs.length===MONTH.rooms.length && sum!==t.total)
        errs.push(`${e.name}: ล็อกครบทุกห้องรวม ${sum} แต่เป้ารวม ${t.total}`);
    }
    // วันว่างพอไหม
    const avail = days.filter(d=>!isLeave(e.id,d)).length;
    const want = t.total!=null ? t.total : 0;
    if(want>avail) errs.push(`${e.name}: ต้องได้ ${want} เวร แต่ว่างแค่ ${avail} วัน`);
    if(t.maxWeek!=null){
      const cap = weeksOf().length * t.maxWeek;
      if(want>cap) errs.push(`${e.name}: จำกัด ${t.maxWeek} เวร/สัปดาห์ × ${weeksOf().length} สัปดาห์ = ${cap} เวร แต่เป้ารวม ${want}`);
    }
  });

  // 4) บทบาทช่อง: ตำแหน่งนั้นมีกำลังพอไหม
  const roleNeed = {};
  MONTH.rooms.forEach(r=>r.slots.forEach(s=>{ if(s.role) roleNeed[s.role]=(roleNeed[s.role]||0)+days.length; }));
  Object.entries(roleNeed).forEach(([pid,need])=>{
    const cap = pool.filter(e=>e.positionId===pid)
      .reduce((a,e)=>{ const t=tg(e.id); const av=days.filter(d=>!isLeave(e.id,d)).length;
                       return a + (t.total!=null?Math.min(t.total,av):av); },0);
    if(cap<need) errs.push(`ช่องที่ต้องเป็น ${posName(pid)} ต้องการ ${need} เวร แต่ ${posName(pid)} ทั้งหมดมีกำลังรวม ${cap} เวร`);
    else info.push(`ช่อง ${posName(pid)} ต้องการ ${need} เวร · กำลังที่มี ${cap} เวร`);
  });

  // 5) คนพอต่อวันไหม
  days.forEach(d=>{
    const av = pool.filter(e=>!isLeave(e.id,d)).length;
    if(av<perDay()) errs.push(`วันที่ ${d}: มีคนว่าง ${av} คน แต่ต้องการ ${perDay()} คน`);
    else if(av===perDay()) warns.push(`วันที่ ${d}: คนว่างพอดี ${av} คน ไม่มีตัวสำรอง`);
  });

  // 6) คู่ห้ามทั้งวัน — ผลรวมเวรของสองคนต้องไม่เกินจำนวนวัน
  allPairs().filter(r=>r.scope==='day').forEach(r=>{
    const a=empById(r.a), b=empById(r.b); if(!a||!b) return;
    const ta=tg(r.a).total, tb=tg(r.b).total;
    if(ta!=null&&tb!=null&&ta+tb>days.length)
      errs.push(`${a.name} + ${b.name} ห้ามอยู่วันเดียวกัน แต่เป้ารวมกัน ${ta+tb} เวร > ${days.length} วันทำการ`);
  });

  return {errs, warns, info, ok:errs.length===0};
}

/* =====================================================================
   SOLVER
   ===================================================================== */
function slotList(){ const L=[]; MONTH.rooms.forEach(r=>r.slots.forEach((s,i)=>L.push({r,i,role:s.role}))); return L; }

function newSol(){
  const days = workDayList(), wi = weekIndex();
  const A={}, cnt={}, cntR={}, cntW={}, dayMap={};
  emps().forEach(e=>{ cnt[e.id]=0; cntR[e.id]={}; cntW[e.id]={}; MONTH.rooms.forEach(r=>cntR[e.id][r.id]=0); });
  days.forEach(d=>{ A[d]={}; dayMap[d]=new Set(); MONTH.rooms.forEach(r=>A[d][r.id]=new Array(roomSize(r)).fill(null)); });
  return {A,cnt,cntR,cntW,dayMap,wi,days};
}
function put(S,d,rid,i,eid){
  S.A[d][rid][i]=eid; S.dayMap[d].add(eid);
  S.cnt[eid]++; S.cntR[eid][rid]++; const w=S.wi[d]; S.cntW[eid][w]=(S.cntW[eid][w]||0)+1;
}
function pull(S,d,rid,i){
  const eid=S.A[d][rid][i]; if(!eid) return null;
  S.A[d][rid][i]=null; S.dayMap[d].delete(eid);
  S.cnt[eid]--; S.cntR[eid][rid]--; const w=S.wi[d]; S.cntW[eid][w]--;
  return eid;
}
// วันทำการก่อนหน้า/ถัดไป
function prevWork(S,d){ const i=S.days.indexOf(d); return i>0?S.days[i-1]:null; }
function nextWork(S,d){ const i=S.days.indexOf(d); return (i>=0&&i<S.days.length-1)?S.days[i+1]:null; }
function inRoomOn(S,eid,d,rid){ return d!=null && (S.A[d]?.[rid]||[]).includes(eid); }
function onDay(S,eid,d){ return d!=null && S.dayMap[d].has(eid); }

/* ความยาวของ "ช่วงติดกัน" ถ้าลงคนนี้ในวันนี้ — ต้องนับทั้งย้อนหลังและไปข้างหน้า
   (ถ้าดูแค่ย้อนหลัง การสลับช่องจะสร้างสตรีคยาวเกินได้โดยไม่มีใครจับ) */
function runLenRoom(S,eid,d,rid){
  let n=1, cur=prevWork(S,d);
  while(cur!=null && inRoomOn(S,eid,cur,rid)){ n++; cur=prevWork(S,cur); }
  cur=nextWork(S,d);
  while(cur!=null && inRoomOn(S,eid,cur,rid)){ n++; cur=nextWork(S,cur); }
  return n;
}
function runLenDay(S,eid,d){
  let n=1, cur=prevWork(S,d);
  while(cur!=null && onDay(S,eid,cur)){ n++; cur=prevWork(S,cur); }
  cur=nextWork(S,d);
  while(cur!=null && onDay(S,eid,cur)){ n++; cur=nextWork(S,cur); }
  return n;
}

/* เหตุผลที่ลงไม่ได้ (null = ลงได้) */
function whyNot(S,eid,d,r,i,role){
  const e = empById(eid); if(!e||e.active===false) return 'ไม่ได้ใช้งาน';
  if(role && e.positionId!==role) return 'ช่องนี้ต้องเป็น '+posName(role);
  if(isLeave(eid,d)) return 'ลา/ไม่ว่างวันนี้';
  if(S.dayMap[d].has(eid)) return 'มีเวรวันนี้แล้ว';
  const t = tg(eid);
  if(t.total!=null && S.cnt[eid] >= t.total) return 'ครบเป้า '+t.total+' เวรแล้ว';
  const q = t.rooms[r.id];
  if(q!=null && S.cntR[eid][r.id] >= q) return 'ครบโควตา '+r.name+' '+q+' เวรแล้ว';
  if(t.maxWeek!=null && (S.cntW[eid][S.wi[d]]||0) >= t.maxWeek) return 'ครบ '+t.maxWeek+' เวรในสัปดาห์นี้';
  if(r.maxStreak && runLenRoom(S,eid,d,r.id) > r.maxStreak)
    return r.name+' ติดกันเกิน '+r.maxStreak+' วัน';
  if(MONTH.soft.noB2B.on && MONTH.soft.noB2B.hard && runLenDay(S,eid,d) > 1)
    return 'ห้ามขึ้นเวรติดกัน';
  for(const rule of allPairs()){
    const other = rule.a===eid ? rule.b : (rule.b===eid ? rule.a : null);
    if(!other) continue;
    if(rule.scope==='day'){
      if(S.dayMap[d].has(other)) return 'ห้ามอยู่วันเดียวกับ '+(empById(other)||{}).name;
    }else if(rule.scope==='anyroom'){
      if((S.A[d][r.id]||[]).includes(other)) return 'ห้ามอยู่ห้องเดียวกับ '+(empById(other)||{}).name;
    }else{
      if(rule.scope===r.id && (S.A[d][r.id]||[]).includes(other))
        return 'ห้ามอยู่ '+r.name+' กับ '+(empById(other)||{}).name;
    }
  }
  return null;
}

/* ต้นทุนของการเลือกคนนี้ (ต่ำ = ดี) */
function pickCost(S,eid,d,r,i,ctx){
  const t = tg(eid), s = MONTH.soft;
  const daysLeft = Math.max(1, S.days.filter(x=>x>=d && !isLeave(eid,x)).length);
  const goal = t.total!=null ? t.total : ctx.fairShare[eid];
  const urg  = (goal - S.cnt[eid]) / daysLeft;
  const q = t.rooms[r.id];
  const goalR = q!=null ? q : (goal * roomSize(r)*S.days.length / Math.max(1,totalSlots()));
  const urgR = (goalR - S.cntR[eid][r.id]) / daysLeft;
  let c = -(urg*140 + urgR*80);

  const pd = prevWork(S,d);
  if(s.noB2B.on && !s.noB2B.hard && onDay(S,eid,pd)) c += s.noB2B.w*4;
  if(r.streakW && inRoomOn(S,eid,pd,r.id))          c += r.streakW*5;
  if(s.roomVar.on && q==null)                        c += s.roomVar.w * S.cntR[eid][r.id]*0.6;
  if(s.weekly.on)                                    c += s.weekly.w * (S.cntW[eid][S.wi[d]]||0)*1.2;
  if(s.pairVar.on){
    for(const o of (S.A[d][r.id]||[])) if(o) c += s.pairVar.w * (ctx.pairs[eid]?.[o]||0);
  }
  if(s.groupPref.on && s.groupPref.rooms.length){
    const inG = s.groupPref.rooms.includes(r.id);
    const g = MONTH.rooms.filter(x=>s.groupPref.rooms.includes(x.id)).reduce((a,x)=>a+S.cntR[eid][x.id],0);
    const o = S.cnt[eid]-g;
    if(inG && g<=o) c -= s.groupPref.w*3;
    if(!inG && g<=o) c += s.groupPref.w*3;
  }
  return c + Math.random()*1.2;
}

function buildContext(){
  const pool = emps(), slots = totalSlots();
  const fixed = pool.filter(e=>tg(e.id).total!=null);
  const rest = slots - fixed.reduce((a,e)=>a+tg(e.id).total,0);
  const freeN = pool.length - fixed.length;
  const fairShare = {};
  pool.forEach(e=>{ const t=tg(e.id); fairShare[e.id] = t.total!=null ? t.total : (freeN? rest/freeN : 0); });
  return {fairShare, pairs:{}};
}

function construct(ctx){
  const S = newSol(), pool = emps();
  // ล็อกก่อน
  for(const d of S.days) for(const r of MONTH.rooms) r.slots.forEach((s,i)=>{
    const lk = MONTH.locks[d+'|'+r.id+'|'+i];
    if(lk && empById(lk) && !S.dayMap[d].has(lk)) put(S,d,r.id,i,lk);
  });
  for(const d of S.days){
    const open = [];
    MONTH.rooms.forEach(r=>r.slots.forEach((s,i)=>{ if(!S.A[d][r.id][i]) open.push({r,i,role:s.role}); }));
    // ช่องที่มีเงื่อนไขตำแหน่งก่อน (หาคนยากกว่า)
    open.sort((a,b)=>(a.role?0:1)-(b.role?0:1) || Math.random()-0.5);
    for(const sl of open){
      const cands=[];
      for(const e of pool){
        if(whyNot(S,e.id,d,sl.r,sl.i,sl.role)) continue;
        cands.push({id:e.id, c:pickCost(S,e.id,d,sl.r,sl.i,ctx)});
      }
      if(!cands.length) continue;
      cands.sort((a,b)=>a.c-b.c);
      const k = Math.min(cands.length, 1+Math.floor(Math.random()*3));
      const pick = cands[Math.floor(Math.random()*k)].id;
      // จำคู่ที่เคยเจอกัน
      for(const o of S.A[d][sl.r.id]) if(o){
        ctx.pairs[pick]=ctx.pairs[pick]||{}; ctx.pairs[o]=ctx.pairs[o]||{};
        ctx.pairs[pick][o]=(ctx.pairs[pick][o]||0)+1; ctx.pairs[o][pick]=(ctx.pairs[o][pick]||0)+1;
      }
      put(S,d,sl.r.id,sl.i,pick);
    }
  }
  return S;
}

/* ค่าความผิดพลาดของโควตา (0 = ตรงเป๊ะ) */
function quotaError(S){
  let err=0, empty=0;
  for(const d of S.days) for(const r of MONTH.rooms)
    for(let i=0;i<roomSize(r);i++) if(!S.A[d][r.id][i]) empty++;
  emps().forEach(e=>{
    const t=tg(e.id);
    if(t.total!=null) err += Math.abs(S.cnt[e.id]-t.total);
    MONTH.rooms.forEach(r=>{ const q=t.rooms[r.id]; if(q!=null) err += Math.abs(S.cntR[e.id][r.id]-q); });
  });
  return {err, empty, score: err*10 + empty*200};
}

function allSlots(S){
  const out=[];
  for(const d of S.days) for(const r of MONTH.rooms) r.slots.forEach((s,i)=>out.push({d,r,i,role:s.role}));
  return out;
}
function locked(d,rid,i){ return !!MONTH.locks[d+'|'+rid+'|'+i]; }

/* ลองสลับ 2 ช่อง — คืน true ถ้าทำแล้วสำเร็จ (ตรวจกฎครบ) */
function trySwap(S,A,B){
  if(locked(A.d,A.r.id,A.i)||locked(B.d,B.r.id,B.i)) return false;
  const a = S.A[A.d][A.r.id][A.i], b = S.A[B.d][B.r.id][B.i];
  if(a===b) return false;
  if(a) pull(S,A.d,A.r.id,A.i); if(b) pull(S,B.d,B.r.id,B.i);
  const okA = !b || !whyNot(S,b,A.d,A.r,A.i,A.role);
  const okB = !a || !whyNot(S,a,B.d,B.r,B.i,B.role);
  if(okA&&okB){ if(b) put(S,A.d,A.r.id,A.i,b); if(a) put(S,B.d,B.r.id,B.i,a); return true; }
  if(a) put(S,A.d,A.r.id,A.i,a); if(b) put(S,B.d,B.r.id,B.i,b);
  return false;
}
/* ลองเปลี่ยนคนในช่องเป็นคนใหม่ */
function tryReplace(S,slot,eid){
  if(locked(slot.d,slot.r.id,slot.i)) return false;
  const old = S.A[slot.d][slot.r.id][slot.i];
  if(old===eid) return false;
  if(old) pull(S,slot.d,slot.r.id,slot.i);
  if(!whyNot(S,eid,slot.d,slot.r,slot.i,slot.role)){ put(S,slot.d,slot.r.id,slot.i,eid); return true; }
  if(old) put(S,slot.d,slot.r.id,slot.i,old);
  return false;
}

function repairQuota(S,iters){
  const slots = allSlots(S);
  let best = quotaError(S).score;
  for(let it=0; it<iters && best>0; it++){
    // หาคนที่ยังขาด
    const need=[];
    emps().forEach(e=>{
      const t=tg(e.id);
      if(t.total!=null && S.cnt[e.id]<t.total) need.push({e, room:null});
      MONTH.rooms.forEach(r=>{ const q=t.rooms[r.id];
        if(q!=null && S.cntR[e.id][r.id]<q) need.push({e, room:r}); });
    });
    let moved=false;
    if(need.length){
      const pickNeed = need[Math.floor(Math.random()*need.length)];
      const pool = pickNeed.room ? slots.filter(s=>s.r.id===pickNeed.room.id) : slots;
      for(let k=0;k<40;k++){
        const sl = pool[Math.floor(Math.random()*pool.length)];
        const before = quotaError(S).score;
        if(tryReplace(S, sl, pickNeed.e.id)){
          const after = quotaError(S).score;
          if(after<=before){ moved=true; if(after<best) best=after; break; }
          // ย้อนกลับไม่ได้ตรง ๆ → ปล่อยไว้ถ้าไม่แย่ลง, ไม่งั้นสลับกลับด้วย swap สุ่มถัดไป
          if(after>before){ /* ยอมรับชั่วคราวไม่ได้ → พยายาม swap แทน */ }
        }
      }
    }
    if(!moved){
      const A = slots[Math.floor(Math.random()*slots.length)];
      const B = slots[Math.floor(Math.random()*slots.length)];
      const before = quotaError(S).score;
      if(trySwap(S,A,B)){
        const after = quotaError(S).score;
        if(after>before) trySwap(S,A,B);       // สลับกลับ
        else if(after<best) best=after;
      }
    }
  }
  return quotaError(S);
}

/* คะแนน soft (ต่ำ = ดี) */
function softScore(S){
  const s = MONTH.soft; let sc=0;
  const seen = {};
  for(let di=0; di<S.days.length; di++){
    const d=S.days[di], pd = di>0?S.days[di-1]:null;
    for(const r of MONTH.rooms){
      const arr=(S.A[d][r.id]||[]).filter(Boolean);
      arr.forEach(e=>{
        if(pd!=null && r.streakW && inRoomOn(S,e,pd,r.id)) sc += r.streakW*4;
        if(s.noB2B.on && pd!=null && onDay(S,e,pd)) sc += s.noB2B.w*2;
      });
      for(let a=0;a<arr.length;a++) for(let b=a+1;b<arr.length;b++){
        const k=[arr[a],arr[b]].sort().join('|'); seen[k]=(seen[k]||0)+1;
        if(s.pairVar.on) sc += s.pairVar.w*(seen[k]-1)*0.5;
      }
    }
  }
  emps().forEach(e=>{
    if(s.weekly.on){
      const ws = weeksOf().map((w,i)=>S.cntW[e.id][i]||0);
      const avg = ws.reduce((a,b)=>a+b,0)/Math.max(1,ws.length);
      sc += s.weekly.w * ws.reduce((a,b)=>a+(b-avg)**2,0);
    }
    if(s.roomVar.on){
      const cs = MONTH.rooms.map(r=>S.cntR[e.id][r.id]);
      const avg = cs.reduce((a,b)=>a+b,0)/Math.max(1,cs.length);
      sc += s.roomVar.w * cs.reduce((a,b)=>a+(b-avg)**2,0)*0.4;
    }
    if(s.groupPref.on && s.groupPref.rooms.length){
      const g = MONTH.rooms.filter(x=>s.groupPref.rooms.includes(x.id)).reduce((a,x)=>a+S.cntR[e.id][x.id],0);
      if(g <= S.cnt[e.id]-g) sc += s.groupPref.w*12;
    }
    if(s.even.on && tg(e.id).total==null){
      // เฉพาะคนที่ไม่ได้ล็อกเป้า → เกลี่ยกันเอง
    }
  });
  return sc;
}
function polishSoft(S,iters){
  const slots = allSlots(S);
  let q = quotaError(S).score, sc = softScore(S);
  for(let it=0; it<iters; it++){
    const A = slots[Math.floor(Math.random()*slots.length)];
    const B = slots[Math.floor(Math.random()*slots.length)];
    if(!trySwap(S,A,B)) continue;
    const q2 = quotaError(S).score, sc2 = softScore(S);
    if(q2>q || (q2===q && sc2>sc)) trySwap(S,A,B);   // แย่ลง → สลับกลับ
    else { q=q2; sc=sc2; }
  }
}

/* จำนวนครั้งที่ "ขึ้นเวรติดกัน" ต่ำสุดที่เป็นไปได้ทางคณิตศาสตร์ของคนคนนี้
   — คนที่ต้องได้ 15 เวรใน 22 วัน ยังไงก็ต้องติดกันอย่างน้อย 4 ครั้ง ไม่ใช่ความผิดของตัวจัด */
function minAdjacent(eid){
  const t = tg(eid); if(t.total==null) return null;
  const days = workDayList();
  let maxSpread=0, run=0;
  days.forEach(d=>{ if(!isLeave(eid,d)) run++; else { maxSpread+=Math.ceil(run/2); run=0; } });
  maxSpread += Math.ceil(run/2);
  return Math.max(0, t.total - maxSpread);
}
function minAdjacentTotal(){
  let s=0, known=true;
  emps().forEach(e=>{ const m=minAdjacent(e.id); if(m==null) known=false; else s+=m; });
  return known ? s : null;
}

function solFromSchedule(){
  const S = newSol();
  S.days.forEach(d=>MONTH.rooms.forEach(r=>(MONTH.schedule[d]?.[r.id]||[]).forEach((v,i)=>{
    if(v && empById(v) && !S.dayMap[d].has(v)) put(S,d,r.id,i,v); })));
  return S;
}

function generate(){
  const pf = preflight();
  if(!pf.ok){ alert('ยังจัดไม่ได้ เพราะ:\n\n• '+pf.errs.join('\n• ')); render(); return; }
  const t0 = performance.now();
  let best=null, bestKey=null;
  for(let t=0;t<16;t++){
    const ctx = buildContext();
    const S = construct(ctx);
    repairQuota(S, 3000);
    const q = quotaError(S);
    polishSoft(S, q.score===0 ? 2500 : 600);
    const q2 = quotaError(S);
    const key = [q2.empty, q2.err, Math.round(softScore(S))];
    if(!bestKey || key[0]<bestKey[0] || (key[0]===bestKey[0]&&key[1]<bestKey[1])
       || (key[0]===bestKey[0]&&key[1]===bestKey[1]&&key[2]<bestKey[2])){ best=S; bestKey=key; }
    if(performance.now()-t0 > 4000) break;
  }
  polishSoft(best, 9000);            // เกลี่ยตัวที่ดีที่สุดต่ออีกยาว ๆ
  const q = quotaError(best);
  MONTH.schedule = best.A;
  MONTH.lastRun = {at:Date.now(), empty:q.empty, quotaErr:q.err, soft:Math.round(softScore(best)),
                   ms:Math.round(performance.now()-t0)};
  save(); render();
}
/* เกลี่ยต่อจากตารางเดิม โดยไม่รื้อทั้งใบ */
function improve(){
  if(!MONTH.schedule) return;
  const t0=performance.now();
  const S = solFromSchedule();
  polishSoft(S, 14000);
  const q = quotaError(S);
  MONTH.schedule = S.A;
  MONTH.lastRun = {at:Date.now(), empty:q.empty, quotaErr:q.err, soft:Math.round(softScore(S)),
                   ms:Math.round(performance.now()-t0), tuned:true};
  save(); render();
}

/* =====================================================================
   ตรวจสอบ — สร้างรายงานตามเงื่อนไขที่ตั้งไว้ (ไม่ hardcode)
   ===================================================================== */
function analyse(){
  const sched = MONTH.schedule;
  const days = workDayList(), wi = weekIndex(), weeks = weeksOf();
  const byslot={}, checks=[];
  const mark=(k,msg,lvl)=>{ (byslot[k]=byslot[k]||[]).push({msg,lvl}); };
  const cnt={}, cntR={}, cntW={};
  emps().forEach(e=>{ cnt[e.id]=0; cntR[e.id]={}; cntW[e.id]={}; MONTH.rooms.forEach(r=>cntR[e.id][r.id]=0); });
  if(!sched) return {checks, byslot, cnt, cntR, cntW, ok:false};

  const S = {A:sched, days, wi, dayMap:{}, cnt, cntR, cntW};
  days.forEach(d=>{ S.dayMap[d]=new Set();
    MONTH.rooms.forEach(r=>(sched[d]?.[r.id]||[]).forEach(x=>{ if(x) S.dayMap[d].add(x); })); });
  days.forEach(d=>MONTH.rooms.forEach(r=>(sched[d]?.[r.id]||[]).forEach(x=>{
    if(x&&cnt[x]!=null){ cnt[x]++; cntR[x][r.id]++; cntW[x][wi[d]]=(cntW[x][wi[d]]||0)+1; } })));

  const add=(ok,title,detail,soft)=>checks.push({ok,title,detail:detail||[],soft:!!soft});

  // 1 จำนวนคนครบทุกห้องทุกวัน
  let miss=[];
  days.forEach(d=>MONTH.rooms.forEach(r=>{
    const arr=sched[d]?.[r.id]||[];
    for(let i=0;i<roomSize(r);i++) if(!arr[i]){
      miss.push(`วันที่ ${d} ${r.name} ช่อง ${i+1}`); mark(d+'|'+r.id+'|'+i,'ยังไม่มีคน','hard'); }
  }));
  add(miss.length===0, `จำนวนคนครบทุกห้องทุกวัน (${MONTH.rooms.map(r=>r.name+' '+roomSize(r)).join(' / ')} = ${perDay()} คน/วัน)`, miss);

  // 2 บทบาทช่อง
  let roleBad=[];
  days.forEach(d=>MONTH.rooms.forEach(r=>r.slots.forEach((s,i)=>{
    const x=sched[d]?.[r.id]?.[i]; if(!x||!s.role) return;
    const e=empById(x);
    if(!e||e.positionId!==s.role){
      roleBad.push(`วันที่ ${d} ${r.name} ช่อง ${i+1} ต้องเป็น ${posName(s.role)} แต่เป็น ${e?posName(e.positionId):'?'}`);
      mark(d+'|'+r.id+'|'+i,'ผิดบทบาทช่อง','hard'); }
  })));
  const roleSpec = MONTH.rooms.some(r=>r.slots.some(s=>s.role));
  if(roleSpec) add(roleBad.length===0,
    'องค์ประกอบตำแหน่งในห้องถูกต้อง ('+MONTH.rooms.filter(r=>r.slots.some(s=>s.role))
      .map(r=>r.name+' = '+r.slots.map(s=>s.role?posName(s.role):'ใครก็ได้').join(' + ')).join(' · ')+')', roleBad);

  // 3 หนึ่งคนหนึ่งห้องต่อวัน
  let dup=[];
  days.forEach(d=>{
    const seen={};
    MONTH.rooms.forEach(r=>(sched[d]?.[r.id]||[]).forEach((x,i)=>{ if(x) (seen[x]=seen[x]||[]).push({r,i}); }));
    Object.entries(seen).forEach(([e,pl])=>{ if(pl.length>1){
      dup.push(`วันที่ ${d}: ${(empById(e)||{}).name} อยู่ ${pl.length} ห้อง`);
      pl.forEach(p=>mark(d+'|'+p.r.id+'|'+p.i,'ซ้ำหลายห้องในวันเดียว','hard')); } });
  });
  add(dup.length===0, 'หนึ่งคนอยู่ได้ไม่เกิน 1 ห้องต่อวัน', dup);

  // 4 วันห้ามขึ้นเวร
  let lv=[];
  days.forEach(d=>MONTH.rooms.forEach(r=>(sched[d]?.[r.id]||[]).forEach((x,i)=>{
    if(x&&isLeave(x,d)){ lv.push(`${(empById(x)||{}).name} ถูกจัดวันที่ ${d} ทั้งที่แจ้งไม่ว่าง`);
      mark(d+'|'+r.id+'|'+i,'วันที่แจ้งไม่ว่าง','hard'); } })));
  add(lv.length===0, 'ไม่มีใครถูกจัดในวันที่แจ้งไม่ว่าง', lv);

  // 5 คู่ห้าม
  allPairs().forEach(rule=>{
    const a=empById(rule.a), b=empById(rule.b); if(!a||!b) return;
    const bad=[];
    days.forEach(d=>{
      if(rule.scope==='day'){
        if(S.dayMap[d].has(rule.a)&&S.dayMap[d].has(rule.b)) bad.push('วันที่ '+d);
      } else {
        MONTH.rooms.forEach(r=>{
          if(rule.scope!=='anyroom' && rule.scope!==r.id) return;
          const arr=sched[d]?.[r.id]||[];
          if(arr.includes(rule.a)&&arr.includes(rule.b)){ bad.push('วันที่ '+d+' '+r.name);
            arr.forEach((x,i)=>{ if(x===rule.a||x===rule.b) mark(d+'|'+r.id+'|'+i,'คู่ห้าม','hard'); }); }
        });
      }
    });
    const scopeTxt = rule.scope==='day'?'ห้ามอยู่วันเดียวกัน'
      : rule.scope==='anyroom'?'ห้ามอยู่ห้องเดียวกัน' : 'ห้ามอยู่ '+(roomById(rule.scope)||{name:'?'}).name+' ด้วยกัน';
    add(bad.length===0, `${a.name} + ${b.name} — ${scopeTxt}`, bad);
  });

  // 6 เป้าเวรรวมรายคน
  const tBad=[];
  emps().forEach(e=>{ const t=tg(e.id);
    if(t.total!=null && cnt[e.id]!==t.total)
      tBad.push(`${e.name}: ได้ ${cnt[e.id]} เวร ต้องได้ ${t.total} (${cnt[e.id]>t.total?'เกิน':'ขาด'} ${Math.abs(cnt[e.id]-t.total)})`); });
  const anyT = emps().some(e=>tg(e.id).total!=null);
  if(anyT) add(tBad.length===0, 'จำนวนเวรรวมรายบุคคลตรงตามที่กำหนด', tBad);

  // 7 โควตารายห้อง
  const qBad=[];
  emps().forEach(e=>{ const t=tg(e.id);
    MONTH.rooms.forEach(r=>{ const q=t.rooms[r.id];
      if(q!=null && cntR[e.id][r.id]!==q)
        qBad.push(`${e.name} ${r.name}: ได้ ${cntR[e.id][r.id]} ต้องได้ ${q}`); }); });
  const anyQ = emps().some(e=>MONTH.rooms.some(r=>tg(e.id).rooms[r.id]!=null));
  if(anyQ) add(qBad.length===0, 'โควตารายห้องรายบุคคลตรงตามที่ล็อกไว้', qBad);

  // 8 สูงสุดต่อสัปดาห์
  const wBad=[];
  emps().forEach(e=>{ const mw=tg(e.id).maxWeek; if(mw==null) return;
    weeks.forEach((w,i)=>{ const n=cntW[e.id][i]||0;
      if(n>mw) wBad.push(`${e.name} สัปดาห์ที่ ${i+1} (วันที่ ${w[0]}–${w[w.length-1]}) ได้ ${n} เวร เกิน ${mw}`); }); });
  if(emps().some(e=>tg(e.id).maxWeek!=null)) add(wBad.length===0,'จำนวนเวรต่อสัปดาห์ไม่เกินที่กำหนด', wBad);

  // 9 ห้องเดิมติดกันเกินกำหนด
  MONTH.rooms.filter(r=>r.maxStreak).forEach(r=>{
    const bad=[]; const run={};
    days.forEach((d,di)=>{
      const arr=(sched[d]?.[r.id]||[]).filter(Boolean);
      emps().forEach(e=>{
        if(arr.includes(e.id)){ run[e.id]=(run[e.id]||0)+1;
          if(run[e.id]>r.maxStreak) bad.push(`${e.name} อยู่ ${r.name} ติดกัน ${run[e.id]} วัน (ถึงวันที่ ${d})`); }
        else run[e.id]=0; });
    });
    add(bad.length===0, `ไม่มีใครอยู่ ${r.name} ติดกันเกิน ${r.maxStreak} วัน`, bad);
  });

  // 10 ยอดรวมรายห้อง
  const totBad=[];
  MONTH.rooms.forEach(r=>{
    const got = days.reduce((a,d)=>a+(sched[d]?.[r.id]||[]).filter(Boolean).length,0);
    const need = days.length*roomSize(r);
    if(got!==need) totBad.push(`${r.name}: ${got} / ต้องการ ${need}`);
  });
  const grand = days.reduce((a,d)=>a+MONTH.rooms.reduce((b,r)=>b+(sched[d]?.[r.id]||[]).filter(Boolean).length,0),0);
  add(totBad.length===0 && grand===totalSlots(),
    `ยอดรวมทั้งเดือน: ${MONTH.rooms.map(r=>r.name+' '+days.length*roomSize(r)).join(' / ')} = ${totalSlots()} เวร`,
    totBad.concat(grand!==totalSlots()?[`รวมได้จริง ${grand}`]:[]));

  // --- soft ---
  const b2b=[];
  days.forEach((d,di)=>{ if(di===0) return; const pd=days[di-1];
    emps().forEach(e=>{ if(S.dayMap[d].has(e.id)&&S.dayMap[pd].has(e.id)){
      b2b.push(`${e.name} วันที่ ${pd}→${d}`);
      MONTH.rooms.forEach(r=>(sched[d]?.[r.id]||[]).forEach((x,i)=>{ if(x===e.id) mark(d+'|'+r.id+'|'+i,'ขึ้นเวรติดกัน','soft'); }));
    } }); });
  if(MONTH.soft.noB2B.on){
    const floor = minAdjacentTotal();
    add(floor!=null ? b2b.length<=floor : b2b.length===0,
      floor!=null
        ? `ขึ้นเวรติดกัน — พบ ${b2b.length} ครั้ง (ต่ำสุดที่เป็นไปได้จากโควตาที่ตั้งไว้ = ${floor} ครั้ง)`
        : `ขึ้นเวรติดกัน — พบ ${b2b.length} ครั้ง`,
      (floor!=null?[`คนที่ต้องได้ ${Math.max(...emps().map(e=>tg(e.id).total||0))} เวรใน ${days.length} วัน ยังไงก็ต้องมีวันติดกัน — ตัวเลขนี้เทียบกับขั้นต่ำ ไม่ใช่เทียบกับศูนย์`]:[])
        .concat(b2b.slice(0,30)), true);
  }

  MONTH.rooms.filter(r=>r.streakW).forEach(r=>{
    const bad=[];
    days.forEach((d,di)=>{ if(di===0) return; const pd=days[di-1];
      const now=(sched[d]?.[r.id]||[]).filter(Boolean), prev=(sched[pd]?.[r.id]||[]).filter(Boolean);
      now.forEach(e=>{ if(prev.includes(e)) bad.push(`${(empById(e)||{}).name} ${pd}→${d}`); }); });
    add(bad.length===0, `${r.name} ติดกัน 2 วัน — พบ ${bad.length} ครั้ง`, bad.slice(0,40), true);
  });

  if(MONTH.soft.groupPref.on && MONTH.soft.groupPref.rooms.length){
    const gr = MONTH.rooms.filter(r=>MONTH.soft.groupPref.rooms.includes(r.id));
    const bad=[];
    emps().forEach(e=>{
      const g = gr.reduce((a,r)=>a+cntR[e.id][r.id],0), o = cnt[e.id]-g;
      if(g<=o) bad.push(`${e.name}: ${gr.map(r=>r.name).join('+')} ${g} vs อื่น ${o}`); });
    add(bad.length===0, `${gr.map(r=>r.name).join('+')} มากกว่าห้องที่เหลือ (รายคน)`, bad, true);
  }

  const spread=[];
  emps().forEach(e=>{
    const ws = weeks.map((w,i)=>cntW[e.id][i]||0);
    const mx=Math.max(...ws), mn=Math.min(...ws);
    if(mx-mn>=3) spread.push(`${e.name}: ${ws.join(' / ')} (ต่างกัน ${mx-mn})`); });
  if(MONTH.soft.weekly.on) add(spread.length===0, `การกระจายรายสัปดาห์ (${weeks.length} สัปดาห์)`, spread, true);

  return {checks, byslot, cnt, cntR, cntW, weeks, ok:checks.filter(c=>!c.soft).every(c=>c.ok)};
}

      <td style="text-align:right"><button class="ghost danger" onclick="delPos('${p.id}')">ลบ</button></td></tr>`).join('');

    <tr><td><input value="${esc(e.name)}" onchange="setEmp('${e.id}','name',this.value)" style="width:180px"></td>
      <td><select onchange="setEmp('${e.id}','positionId',this.value)">
        ${DB.positions.map(p=>`<option value="${p.id}" ${p.id===e.positionId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></td>
      <td><label class="hint"><input type="checkbox" ${e.active!==false?'checked':''}
            onchange="setEmp('${e.id}','active',this.checked)"> ใช้งาน</label></td>
      <td style="text-align:right"><button class="ghost danger" onclick="delEmp('${e.id}')">ลบ</button></td></tr>`).join('')
      || '<tr><td colspan="4" class="empty">ยังไม่มีพนักงาน</td></tr>';
  return `
  <div class="card"><div class="bd">
    <div class="row"><b>เริ่มต้นเร็ว:</b>
      <button class="primary" onclick="loadSept()">📥 โหลดโจทย์จริง — กันยายน 2569</button>
      <button class="ghost danger" onclick="resetAll()">ล้างข้อมูลทั้งหมด</button>
      <span class="hint">ปุ่มซ้ายจะใส่พนักงาน 13 คน ห้อง SIM/TOMO/INFI โควตา วันลา และคู่ห้ามทั้งหมดให้ทันที</span></div>
  </div></div>
  <div class="grid2">
    <div class="card"><div class="hdr"><h2>👥 พนักงาน</h2><span class="hint">${emps().length} คนที่ใช้งาน</span>
      <div class="sp"></div>
      <button onclick="bulkNames()">📋 วางรายชื่อทีเดียว</button>
      <button class="primary" onclick="addEmp()">+ เพิ่ม</button></div>
      <div class="bd flush"><table><tr><th>ชื่อ</th><th>ตำแหน่ง</th><th></th><th></th></tr>${empRows}</table></div></div>
    <div class="card"><div class="hdr"><h2>🏷️ ตำแหน่ง</h2><div class="sp"></div>
      <button class="primary" onclick="addPos()">+ เพิ่ม</button></div>
      <div class="bd flush"><table><tr><th></th><th>ชื่อ</th><th>สี</th><th></th><th></th></tr>${posRows}</table></div>
      <div class="bd"><div class="note">ตำแหน่งใช้กำหนด <b>บทบาทของช่องเวร</b> ในแท็บ ② เช่น
        INFI ช่อง 1 ต้องเป็น Senior, ช่อง 2–3 ต้องเป็น Junior</div></div></div>
  </div>`;
}
function bulkNames(){
  const pos = DB.positions.map((p,i)=>`${i+1}=${p.name}`).join(' · ');
  const txt = prompt('วางรายชื่อ บรรทัดละ 1 ชื่อ\nขึ้นต้นบรรทัดด้วยชื่อตำแหน่งแล้วเครื่องหมาย : เพื่อสลับตำแหน่ง\n\nเช่น\nSenior:\nขันทอง\nเยาวภา\nJunior:\nกรกนก\n\nตำแหน่งที่มี: '+pos);
  if(!txt) return;
  let cur = DB.positions[0].id;
  txt.split('\n').map(s=>s.trim()).filter(Boolean).forEach(line=>{
    const m = line.match(/^(.+?)\s*[:：]\s*$/);
    if(m){ const p = DB.positions.find(p=>p.name.toLowerCase()===m[1].toLowerCase()); if(p){ cur=p.id; return; } }
    DB.employees.push({id:uid(),name:line.replace(/^\d+[.)]\s*/,''),positionId:cur,active:true});
  });
  save(); render();
}
function resetAll(){
  if(!confirm('ลบข้อมูลทั้งหมดแล้วเริ่มใหม่?\nแนะนำให้กด “สำรอง” ก่อน')) return;
  const k=DB.activeMonth; DB=blankDB(); DB.activeMonth=k; ensureMonth(k); MONTH=DB.months[k]; save(); render();
}
function addEmp(){ if(!DB.positions.length) return alert('เพิ่มตำแหน่งก่อน');
  DB.employees.push({id:uid(),name:'พนักงานใหม่',positionId:DB.positions[0].id,active:true}); save(); render(); }
function setEmp(id,k,v){ const e=empById(id); if(e){ e[k]=v; save(); if(k!=='name') render(); } }
function delEmp(id){ const e=empById(id); if(!confirm('ลบ "'+e.name+'" ถาวร?')) return;
  DB.employees=DB.employees.filter(x=>x.id!==id);
  DB.pairRules=DB.pairRules.filter(r=>r.a!==id&&r.b!==id);
  Object.values(DB.months).forEach(m=>{ delete m.leaves[id]; delete m.targets[id];
    m.pairRules=m.pairRules.filter(r=>r.a!==id&&r.b!==id);
    Object.keys(m.locks).forEach(k=>{ if(m.locks[k]===id) delete m.locks[k]; });
    if(m.schedule) Object.values(m.schedule).forEach(day=>Object.values(day).forEach(a=>a.forEach((x,i)=>{ if(x===id) a[i]=null; })));});
  save(); render(); }
function addPos(){ DB.positions.push({id:uid(),name:'ตำแหน่งใหม่',color:PALETTE[DB.positions.length%PALETTE.length]}); save(); render(); }
function setPos(id,k,v){ const p=posById(id); if(p){ p[k]=v; save(); if(k!=='name') render(); } }
function delPos(id){ if(DB.employees.some(e=>e.positionId===id)) return alert('ยังมีพนักงานใช้ตำแหน่งนี้');
  DB.positions=DB.positions.filter(p=>p.id!==id); save(); render(); }

  let cells=TH_DOW.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++) cells+='<div class="d blank"></div>';
  for(let d=1;d<=nDays();d++) cells+=`<div class="d ${MONTH.workDays[d]?'on':'off'}" onclick="toggleWork(${d})">${d}</div>`;

  const rooms = MONTH.rooms.map(r=>`
    <div style="border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:10px">

        <input value="${esc(r.name)}" onchange="setRoom('${r.id}','name',this.value)" style="width:130px;font-weight:600">
        <span class="hint">ต้องการ ${roomSize(r)} คน/วัน · ทั้งเดือน ${workDayList().length*roomSize(r)} เวร</span>
        <div style="flex:1"></div>
        <button class="ghost danger" onclick="delRoom('${r.id}')">ลบห้อง</button>
      </div>
      <table style="margin-top:8px"><tr><th style="width:70px">ช่อง</th><th>ต้องเป็นตำแหน่ง</th><th></th></tr>
      ${r.slots.map((s,i)=>`<tr><td class="hint">ช่อง ${i+1}</td>
        <td><select onchange="setSlot('${r.id}',${i},this.value)">
          <option value="">ใครก็ได้</option>
          ${DB.positions.map(p=>`<option value="${p.id}" ${s.role===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
        </select></td>
        <td style="text-align:right"><button class="ghost danger" onclick="delSlot('${r.id}',${i})">✕</button></td></tr>`).join('')}
      </table>
      <div class="row" style="margin-top:8px">
        <button class="ghost" onclick="addSlot('${r.id}')">+ เพิ่มช่อง</button>
        <div style="flex:1"></div>
        <span class="hint">ห้ามอยู่ห้องนี้ติดกันเกิน</span>
        <input type="number" min="1" placeholder="ไม่จำกัด" value="${r.maxStreak??''}"
          onchange="setRoom('${r.id}','maxStreak',this.value?+this.value:null)"><span class="hint">วัน</span>
        <span class="hint">· เลี่ยงติดกัน (น้ำหนัก)</span>
        <input type="number" min="0" max="10" value="${r.streakW??0}" onchange="setRoom('${r.id}','streakW',+this.value||0)">
      </div>
    </div>`).join('') || '<div class="empty">ยังไม่มีห้อง</div>';

  const w = weeksOf();
  return `
  <div class="grid2">

function delSlot(id,i){ const r=roomById(id); if(r.slots.length<=1) return alert('ต้องมีอย่างน้อย 1 ช่อง');

/* ---------- ③ โควตา & เป้าหมาย ---------- */
function viewQuota(){
  const pool = emps(), days = workDayList().length;
  const pf = preflight();
  const colNeed = {}; MONTH.rooms.forEach(r=>colNeed[r.id]=days*roomSize(r));
  const sumRoom = {}; MONTH.rooms.forEach(r=>sumRoom[r.id]=0);
  let sumTot=0, nFree=0;
  pool.forEach(e=>{ const t=tg(e.id);
    MONTH.rooms.forEach(r=>{ if(t.rooms[r.id]!=null) sumRoom[r.id]+=t.rooms[r.id]; });
    if(t.total!=null) sumTot+=t.total; else nFree++; });

  const rows = pool.map(e=>{
    const t = tg(e.id);
    const rs = MONTH.rooms.filter(r=>t.rooms[r.id]!=null);
    const sum = rs.reduce((a,r)=>a+t.rooms[r.id],0);
    const bad = t.total!=null && (sum>t.total || (rs.length===MONTH.rooms.length&&sum!==t.total));
    return `<tr>
      <td><span class="tag" style="background:${posColor(e.positionId)}"></span> ${esc(e.name)}</td>
      <td class="hint">${esc(posName(e.positionId))}</td>
      ${MONTH.rooms.map(r=>`<td class="tot"><input type="number" min="0" placeholder="–"
         value="${t.rooms[r.id]??''}" onchange="setQ('${e.id}','${r.id}',this.value)"></td>`).join('')}
      <td class="tot ${bad?'bad':''}"><input type="number" min="0" placeholder="อิสระ"
         value="${t.total??''}" onchange="setT('${e.id}',this.value)" style="width:62px;font-weight:600"></td>
      <td class="tot"><input type="number" min="1" placeholder="–" value="${t.maxWeek??''}"
         onchange="setMW('${e.id}',this.value)"></td>
      <td class="hint">${rs.length?('ล็อกห้องรวม '+sum):''}</td></tr>`;
  }).join('') || `<tr><td colspan="${MONTH.rooms.length+5}" class="empty">ยังไม่มีพนักงาน</td></tr>`;

  const foot = `<tr class="foot"><td colspan="2">ล็อกไว้แล้ว</td>
    ${MONTH.rooms.map(r=>`<td class="tot ${sumRoom[r.id]>colNeed[r.id]?'bad':''}">${sumRoom[r.id]}</td>`).join('')}
    <td class="tot ${sumTot>totalSlots()?'bad':''}">${sumTot}</td><td></td><td></td></tr>
    <tr class="foot"><td colspan="2">ต้องการทั้งเดือน</td>
    ${MONTH.rooms.map(r=>`<td class="tot">${colNeed[r.id]}</td>`).join('')}
    <td class="tot">${totalSlots()}</td><td></td>
    <td class="hint">${nFree?nFree+' คนปล่อยอิสระ':''}</td></tr>`;

  return `
  <div class="card">
    <div class="hdr"><h2>🎯 โควตา & เป้าหมาย — ${monthLabel(MONTH.key)}</h2>
      <span class="hint">เว้นว่าง = ปล่อยให้ระบบตัดสิน · ใส่ตัวเลข = ล็อกให้ได้เป๊ะ</span>
      <div class="sp"></div><button onclick="pasteQuota()">📋 วางตารางจาก Excel</button></div>
    <div class="bd flush"><table class="qt">
      <tr><th>ชื่อ</th><th>ตำแหน่ง</th>${MONTH.rooms.map(r=>`<th style="text-align:center">${esc(r.name)}</th>`).join('')}
        <th style="text-align:center">รวม</th><th style="text-align:center">สูงสุด/สัปดาห์</th><th></th></tr>
      ${rows}${foot}</table></div>
    <div class="bd">
      ${pf.errs.length?`<div class="note bad"><b>❌ ยังจัดไม่ได้ — ต้องแก้ก่อน</b><br>• ${pf.errs.map(esc).join('<br>• ')}</div>`
        :`<div class="note" style="border-left-color:var(--ok)"><b>✅ ตัวเลขกระทบยอดครบ จัดตารางได้</b></div>`}
      ${pf.warns.length?`<div class="note warn" style="margin-top:8px">⚠️ ${pf.warns.slice(0,6).map(esc).join('<br>')}</div>`:''}
      ${pf.info.length?`<div class="note" style="margin-top:8px">${pf.info.map(esc).join('<br>')}</div>`:''}
    </div>
  </div>`;
}
function setQ(e,r,v){ const t=tg(e); if(v==='') delete t.rooms[r]; else t.rooms[r]=+v; save(); render(); }
function setT(e,v){ const t=tg(e); t.total = v===''?null:+v; save(); render(); }
function setMW(e,v){ const t=tg(e); t.maxWeek = v===''?null:+v; save(); render(); }
function pasteQuota(){
  const txt = prompt('วางตารางจาก Excel (คั่นด้วย Tab หรือ ,)\nคอลัมน์: ชื่อ '+MONTH.rooms.map(r=>r.name).join(' ')+' รวม\nเว้นว่างหรือใส่ - ถ้าไม่ล็อก');
  if(!txt) return;
  let n=0;
  txt.split('\n').map(s=>s.trim()).filter(Boolean).forEach(line=>{
    const c = line.split(/\t|,|\s{2,}/).map(s=>s.trim()).filter(x=>x!=='');
    if(c.length<2) return;
    const e = DB.employees.find(x=>x.name===c[0]); if(!e) return;
    const t = tg(e.id);
    MONTH.rooms.forEach((r,i)=>{ const v=c[1+i]; if(v==null||v==='-'||v==='–') return;
      if(/^\d+$/.test(v)) t.rooms[r.id]=+v; });
    const tot = c[1+MONTH.rooms.length];
    if(tot!=null && /^\d+$/.test(tot)) t.total=+tot;
    n++;
  });
  alert('อัปเดต '+n+' คน'); save(); render();
}

function pasteLeave(){

function addRule(where){

        scope=document.getElementById('pscope').value;
  if(!a||!b||a===b) return alert('เลือกคนสองคนที่ต่างกัน');

  if(list.some(r=>((r.a===a&&r.b===b)||(r.a===b&&r.b===a))&&r.scope===scope)) return alert('มีกฎนี้แล้ว');

}
function delRule(w,id){ if(w==='global') DB.pairRules=DB.pairRules.filter(r=>r.id!==id);

function setScope(w,id,v){ const l=w==='global'?DB.pairRules:MONTH.pairRules;

    `<th>${esc(r.name)} <span class="hint">(${roomSize(r)})</span></th>`).join('')}</tr>`;
  let body='';
  for(let d=1; d<=nDays(); d++){
    if(!MONTH.workDays[d]){
      body += `<tr class="holiday"><td class="day"><b>${d}</b>${TH_DOW[dowOf(d)]}.</td>
        <td colspan="${MONTH.rooms.length}" style="color:var(--dim)">หยุด</td></tr>`;
      continue;
    }
    const cells = MONTH.rooms.map(r=>{

        const key=d+'|'+r.id+'|'+i, eid=arr[i], msgs=A.byslot[key]||[];
        const lvl = msgs.some(m=>m.lvl==='hard')?'bad':(msgs.length?'warn':'');
        const lk = !!MONTH.locks[key], e = eid?empById(eid):null;
        return e ? `<div class="slot ${lvl} ${lk?'locked':''}" draggable="true" data-key="${key}"
             title="${esc(msgs.map(m=>m.msg).join(' · '))}">
             <span class="tag" style="background:${posColor(e.positionId)}"></span>
             <span class="nm">${esc(e.name)}</span>
             <span class="lk" onclick="event.stopPropagation();toggleLock('${key}')">${lk?'🔒':'🔓'}</span></div>`

      return `<td><div class="slotbox">${slots}</div></td>`;
    }).join('');
    body += `<tr><td class="day"><b>${d}</b>${TH_DOW[dowOf(d)]}.</td>${cells}</tr>`;
  }

  // สรุปรายบุคคล
  const sum = emps().map(e=>{
    const t=tg(e.id), tot=A.cnt[e.id]||0;
    const diff = t.total!=null ? tot-t.total : null;
    return `<tr><td><span class="tag" style="background:${posColor(e.positionId)}"></span> ${esc(e.name)}</td>
      <td class="hint">${esc(posName(e.positionId))}</td>
      ${MONTH.rooms.map(r=>{ const q=t.rooms[r.id], v=A.cntR[e.id][r.id]||0;
        return `<td class="tot ${q!=null?(v===q?'ok':'bad'):''}">${v}${q!=null?`<span class="hint">/${q}</span>`:''}</td>`;}).join('')}
      <td class="tot ${t.total!=null?(diff===0?'ok':'bad'):''}"><b>${tot}</b>${t.total!=null?`<span class="hint">/${t.total}</span>`:''}</td>
      <td class="hint">${(A.weeks||[]).map((w,i)=>A.cntW[e.id][i]||0).join(' · ')}</td></tr>`;
  }).join('');
  const sumFoot = `<tr class="foot"><td colspan="2">รวม</td>
    ${MONTH.rooms.map(r=>`<td class="tot">${days.reduce((a,d)=>a+(MONTH.schedule[d]?.[r.id]||[]).filter(Boolean).length,0)}</td>`).join('')}
    <td class="tot">${emps().reduce((a,e)=>a+(A.cnt[e.id]||0),0)}</td><td></td></tr>`;

  const hard = A.checks.filter(c=>!c.soft), soft = A.checks.filter(c=>c.soft);
  const chk = c=>`<div class="chk ${c.ok?'':(c.soft?'soft':'fail')}">
    <div class="ic">${c.ok?'✅':(c.soft?'⚠️':'❌')}</div>
    <div class="tx"><b>${esc(c.title)}</b>
      ${c.detail.length?`<div class="det">${c.detail.slice(0,25).map(esc).join('\n')}${c.detail.length>25?`\n… อีก ${c.detail.length-25} รายการ`:''}</div>`:''}
    </div></div>`;

  const nl = MONTH.lastRun, lockN = Object.keys(MONTH.locks).length;
  const nFail = hard.filter(c=>!c.ok).length, nSoft = soft.filter(c=>!c.ok).length;

  return `
  <div class="card noprint"><div class="hdr">
    <h2>📋 ${monthLabel(MONTH.key)}</h2>
    <span class="hint">${days.length} วันทำการ · ${totalSlots()} ช่องเวร</span>
    ${nFail? `<span class="pill bad">❌ ไม่ผ่าน ${nFail} ข้อ</span>` : `<span class="pill ok">✅ ผ่านเงื่อนไขบังคับครบ ${hard.length} ข้อ</span>`}
    ${nSoft? `<span class="pill warn">⚠️ ข้อควรปรับ ${nSoft}</span>`:''}
    <div class="sp"></div>
    ${lockN?`<span class="pill neutral">🔒 ${lockN}</span><button class="ghost" onclick="clearLocks()">ปลดล็อก</button>`:''}
    <button onclick="window.print()">🖨️</button>
    <button onclick="exportCSV()">⤓ CSV</button>
    <button onclick="improve()">🔧 เกลี่ยเพิ่ม</button>
    <button class="primary" onclick="generate()">🎲 สุ่มใหม่</button></div>
    <div class="bd" style="padding-top:9px;padding-bottom:9px"><span class="hint">
      ${nl?`จัดเมื่อ ${new Date(nl.at).toLocaleString('th-TH')} · ใช้เวลา ${nl.ms} ms · ช่องว่าง ${nl.empty} · โควตาคลาดเคลื่อน ${nl.quotaErr}`:''}</span></div>
  </div>

  <div class="card"><div class="hdr"><h2>✔️ รายงานตรวจสอบเงื่อนไข</h2>
    <span class="hint">สร้างจากเงื่อนไขที่ตั้งไว้ทั้งหมด ไม่ได้เขียนตายตัว</span></div>
    <div class="bd"><div class="grid2">
      <div><div class="hint" style="margin-bottom:4px"><b>เงื่อนไขบังคับ</b></div>${hard.map(chk).join('')}</div>
      <div><div class="hint" style="margin-bottom:4px"><b>ข้อควรปรับ (soft)</b></div>${soft.map(chk).join('')||'<div class="hint">—</div>'}</div>
    </div></div></div>

  <div class="card"><div class="bd flush"><table class="sched">${head}${body}</table></div>
    <div class="bd hint noprint">💡 <b>คลิกช่อง</b> = เปลี่ยนคน · <b>ลากสลับ</b> ได้ ·
      <b>🔒</b> ล็อกช่องที่พอใจแล้วค่อยกดสุ่มใหม่</div></div>

  <div class="card"><div class="hdr"><h2>📊 สรุปรายบุคคล</h2>
    <span class="hint">ช่องเขียว = ตรงโควตา · แดง = ยังไม่ตรง</span></div>
    <div class="bd flush"><table class="qt">
      <tr><th>ชื่อ</th><th>ตำแหน่ง</th>${MONTH.rooms.map(r=>`<th style="text-align:center">${esc(r.name)}</th>`).join('')}
        <th style="text-align:center">รวม</th><th>ราย W1–W${(A.weeks||[]).length}</th></tr>
      ${sum}${sumFoot}</table></div></div>`;
}

function toggleLock(key){
  if(MONTH.locks[key]) delete MONTH.locks[key];
  else { const [d,r,i]=key.split('|'); const e=MONTH.schedule?.[d]?.[r]?.[+i]; if(!e) return; MONTH.locks[key]=e; }
  save(); render();
}
function clearLocks(){ MONTH.locks={}; save(); render(); }

let dragKey=null;
function wireSched(){
  document.querySelectorAll('.slot').forEach(el=>{
    el.addEventListener('click', ()=>openPicker(el.dataset.key));
    el.addEventListener('dragstart', ()=>{ dragKey=el.dataset.key; el.classList.add('drag'); });
    el.addEventListener('dragend', ()=>{ el.classList.remove('drag');
      document.querySelectorAll('.over').forEach(x=>x.classList.remove('over')); });
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', ()=>el.classList.remove('over'));
    el.addEventListener('drop', e=>{ e.preventDefault(); swapUI(dragKey, el.dataset.key); });
  });
}
const readSlot = k => { const [d,r,i]=k.split('|'); return MONTH.schedule?.[d]?.[r]?.[+i] ?? null; };
const writeSlot = (k,v) => { const [d,r,i]=k.split('|'); if(MONTH.schedule?.[d]?.[r]) MONTH.schedule[d][r][+i]=v; };
function swapUI(k1,k2){
  if(!k1||!k2||k1===k2) return;
  const a=readSlot(k1), b=readSlot(k2);
  writeSlot(k1,b); writeSlot(k2,a);
  [[k1,b],[k2,a]].forEach(([k,v])=>{ if(MONTH.locks[k]){ if(v) MONTH.locks[k]=v; else delete MONTH.locks[k]; } });
  save(); render();
}
function openPicker(key){
  const [d,rid,idx]=key.split('|'); const dd=+d, r=roomById(rid), role=r.slots[+idx].role;
  const cur=readSlot(key);
  // สร้าง state จำลองจากตารางปัจจุบัน เพื่อบอกเหตุผล
  const S=newSol();
  S.days.forEach(x=>MONTH.rooms.forEach(rr=>(MONTH.schedule[x]?.[rr.id]||[]).forEach((v,i)=>{
    if(v && !(x===dd && rr.id===rid && i===+idx) && !S.dayMap[x].has(v)) put(S,x,rr.id,i,v); })));
  const opts = emps().map(e=>({e, blk:whyNot(S,e.id,dd,r,+idx,role), n:S.cnt[e.id]||0}))
    .sort((a,b)=>(a.blk?1:0)-(b.blk?1:0)||a.n-b.n);
  document.getElementById('modalHost').innerHTML = `
  <div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="mh"><h3>วันที่ ${d} · ${esc(r.name)} · ช่อง ${+idx+1}${role?' ('+esc(posName(role))+')':''}</h3>
      <button class="ghost" onclick="closeModal()">✕</button></div>
    <div class="mb">
      <div class="opt ${!cur?'cur':''}" onclick="assign('${key}',null)"><span class="nm" style="flex:1;color:var(--muted)">— ปล่อยว่าง —</span></div>
      ${opts.map(o=>`<div class="opt ${o.e.id===cur?'cur':''} ${o.blk?'blocked':''}" onclick="assign('${key}','${o.e.id}')">
        <span class="tag" style="background:${posColor(o.e.positionId)}"></span>
        <span class="nm" style="flex:1">${esc(o.e.name)} <span class="hint">${esc(posName(o.e.positionId))}</span></span>
        ${o.blk?`<span class="why">⚠ ${esc(o.blk)}</span>`:`<span class="cnt">${o.n} เวร</span>`}</div>`).join('')}
    </div>
    <div class="mh" style="border-top:1px solid var(--line);border-bottom:0">
      <span class="hint">เลือกคนที่มี ⚠ ได้ — ระบบจะทำเครื่องหมายไว้ ไม่บังคับห้าม</span></div>
  </div></div>`;
}
function closeModal(){ document.getElementById('modalHost').innerHTML=''; }
function assign(key,eid){
  writeSlot(key,eid);
  if(eid) { if(MONTH.locks[key]) MONTH.locks[key]=eid; } else delete MONTH.locks[key];
  closeModal(); save(); render();
}

/* ---------- export ---------- */
/* บางที่ (เช่นหน้าเว็บที่แชร์ผ่านลิงก์) บล็อกการเซฟไฟล์จากหน้าเว็บ
   → เปิดกล่องให้ทั้ง "บันทึกไฟล์" และ "คัดลอกข้อความ" เสมอ จะได้ไม่มีปุ่มที่กดแล้วเงียบ */
function download(name,text,mime){
  window.__dl = {name, text, mime:mime||'text/plain;charset=utf-8'};
  document.getElementById('modalHost').innerHTML = `
  <div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="mh"><h3>${esc(name)}</h3><button class="ghost" onclick="closeModal()">✕</button></div>
    <div class="mb" style="padding:12px 16px">
      <div class="row" style="margin-bottom:9px">
        <button class="primary" id="dlSave" onclick="doSave()">⤓ บันทึกไฟล์</button>
        <button onclick="doCopy(this)">📋 คัดลอกข้อความ</button>
        <span class="hint" id="dlMsg"></span></div>
      <textarea id="dlText" readonly style="width:100%;height:230px;font-family:ui-monospace,Menlo,monospace;
        font-size:11.5px;white-space:pre;overflow:auto">${esc(text)}</textarea>
      <div class="note" style="margin-top:9px">ถ้าปุ่ม “บันทึกไฟล์” ไม่ทำงาน (บางเบราว์เซอร์บล็อก)
        ให้กด <b>คัดลอกข้อความ</b> แล้ววางลงไฟล์เปล่าเอง — เนื้อหาเหมือนกันทุกตัวอักษร</div>
    </div></div></div>`;
  probeSave();
}
/* หน้าเว็บที่เปิดผ่านลิงก์แชร์เซฟไฟล์ตรง ๆ ไม่ได้ ต้องขอผ่าน host
   ส่วนไฟล์ที่เปิดในเครื่องใช้วิธีปกติ — รองรับทั้งสองทาง */
const hosted = () => !!(window.claude && typeof window.claude.use === 'function');
async function getSaver(){
  if(!hosted()) return null;
  try{ return await window.claude.use('downloads'); }catch(e){ return null; }
}
async function probeSave(){
  if(!hosted()) return;
  const dl = await getSaver(), btn = document.getElementById('dlSave');
  if(!btn) return;
  if(!dl){ btn.disabled = true; btn.textContent = '⤓ บันทึกไฟล์ (ที่นี่ทำไม่ได้)';
    const m=document.getElementById('dlMsg'); if(m) m.textContent = 'ใช้ปุ่มคัดลอกข้อความแทน'; }
}
async function doSave(){
  const {name,text,mime}=window.__dl, msg=document.getElementById('dlMsg');
  const dl = await getSaver();
  if(dl){
    msg.textContent='กำลังขออนุญาตบันทึก…';
    try{ await dl.save({filename:name, data:'﻿'+text}); msg.textContent='บันทึกแล้ว'; }
    catch(err){
      const c = err && err.code;
      msg.textContent = c==='declined' ? 'ยกเลิกการบันทึกแล้ว'
        : c==='too_large' ? 'ไฟล์ใหญ่เกินไป — ใช้ปุ่มคัดลอกแทน'
        : c==='rate_limited' ? 'มีคำขอบันทึกค้างอยู่ ลองใหม่อีกครั้ง'
        : 'บันทึกไม่ได้ — ใช้ปุ่มคัดลอกแทน';
    }
    return;
  }
  if(hosted()){ msg.textContent='ที่นี่บันทึกไฟล์ไม่ได้ — ใช้ปุ่มคัดลอกแทน'; return; }
  try{
    const b=new Blob(['﻿'+text],{type:mime});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
    msg.textContent='บันทึกแล้ว';
  }catch(e){ msg.textContent='บันทึกไม่ได้ — ใช้ปุ่มคัดลอกแทน'; }
}
function doCopy(btn){
  const ta=document.getElementById('dlText');
  ta.select(); ta.setSelectionRange(0, ta.value.length);
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(()=>{
    document.getElementById('dlMsg').textContent='คัดลอกแล้ว'; }); return; }
  document.getElementById('dlMsg').textContent = ok?'คัดลอกแล้ว':'กด Ctrl/⌘+C เพื่อคัดลอก (เลือกข้อความไว้ให้แล้ว)';
}
function exportCSV(){
  if(!MONTH.schedule) return alert('ยังไม่มีตาราง');
  const A=analyse(), rows=[];
  rows.push(['วันที่','วัน',...MONTH.rooms.map(r=>r.name)]);
  for(let d=1;d<=nDays();d++){
    if(!MONTH.workDays[d]){ rows.push([d,TH_DOW[dowOf(d)],...MONTH.rooms.map(()=>'หยุด')]); continue; }
    rows.push([d,TH_DOW[dowOf(d)],...MONTH.rooms.map(r=>
      (MONTH.schedule[d]?.[r.id]||[]).map(x=>x?empById(x).name:'—').join(', '))]);
  }
  rows.push([]); rows.push(['สรุปรายบุคคล']);
  rows.push(['ชื่อ','ตำแหน่ง',...MONTH.rooms.map(r=>r.name),'รวม','เป้า']);
  emps().forEach(e=>rows.push([e.name,posName(e.positionId),
    ...MONTH.rooms.map(r=>A.cntR[e.id][r.id]||0), A.cnt[e.id]||0, tg(e.id).total??'']));
  rows.push(['รวม','',...MONTH.rooms.map(r=>workDayList().reduce((a,d)=>
    a+(MONTH.schedule[d]?.[r.id]||[]).filter(Boolean).length,0)),
    emps().reduce((a,e)=>a+(A.cnt[e.id]||0),0),'']);
  rows.push([]); rows.push(['ผลตรวจสอบเงื่อนไข']);
  A.checks.forEach(c=>rows.push([c.ok?'ผ่าน':(c.soft?'ควรปรับ':'ไม่ผ่าน'), c.title, c.detail.join(' | ')]));
  const csv = rows.map(r=>r.map(c=>{ const s=String(c??'');
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\n');
  download('ตารางเวร_'+MONTH.key+'.csv', csv, 'text/csv;charset=utf-8');
}
function backup(){ download('duty-roster-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(DB,null,1),'application/json'); }
function applyRestore(txt){
  try{ const o=JSON.parse(txt);
    if(!o.employees||!o.months) throw new Error('ไม่ใช่ไฟล์สำรองของระบบนี้');
    if(!confirm('กู้คืนทับข้อมูลเดิมทั้งหมด?')) return;
    DB=o; ensureMonth(DB.activeMonth); MONTH=DB.months[DB.activeMonth]; closeModal(); save(); render();
  }catch(e){ alert('อ่านข้อมูลไม่ได้: '+e.message); }
}
function restore(input){
  const f=input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>applyRestore(rd.result);
  rd.readAsText(f); input.value='';
}
function restorePaste(){
  document.getElementById('modalHost').innerHTML = `
  <div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="mh"><h3>กู้คืนจากข้อความ</h3><button class="ghost" onclick="closeModal()">✕</button></div>
    <div class="mb" style="padding:12px 16px">
      <div class="hint" style="margin-bottom:7px">วางเนื้อหาไฟล์สำรอง (.json) ที่คัดลอกไว้</div>
      <textarea id="rsText" style="width:100%;height:220px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px"></textarea>
      <div class="row" style="margin-top:9px">
        <button class="primary" onclick="applyRestore(document.getElementById('rsText').value)">กู้คืน</button>
        <button onclick="closeModal()">ยกเลิก</button></div>
    </div></div></div>`;
}

  set('สรสิช',      15);
  set('ชีวาพร',     15);
  set('นิตวรรณ',    15, [5,5,5]);
  set('สุรีภรณ์',   15);

  MONTH.leaves = {};

              'ชีวาพร':[23],'นิตวรรณ':[2,7,18,28],'จิราภรณ์':[21,23],'ขันทอง':[30]};
  Object.entries(lv).forEach(([n,ds])=>MONTH.leaves[ID[n]]=ds);

  MONTH.pairRules = [
    {id:uid(),a:ID['ขันทอง'],  b:ID['ณัฐนรี'],   scope:R.INFI},

    {id:uid(),a:ID['พัทนันท์'],b:ID['จิราภรณ์'], scope:R.INFI},
